<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171d3f">
  <title>المذاكرة بدون نت | Seif Study OS</title>
  <script src="/study-theme.js"></script>
  <link rel="stylesheet" href="/study-theme.css">
  <link rel="stylesheet" href="/study-offline.css">
  <script src="/study-offline-core.js" defer></script>
  <script src="/study-offline.js" defer></script>
</head>
<body>
  <main>
    <header><img alt="" src="/study-logo.svg" width="44" height="44"><a href="/">Seif Study OS</a><span id="connection"></span></header>
    <section class="hero">
      <h1>المذاكرة بدون نت</h1>
      <p id="status" role="status">جارٍ فتح بيانات الجهاز…</p>
      <p id="pending" aria-live="polite"></p>
    </section>
    <section id="focus" hidden>
      <h2>بومودورو</h2>
      <p id="clock" dir="ltr">25:00</p>
      <label for="minutes">مدة الجلسة</label>
      <select id="minutes"><option value="15">١٥ دقيقة</option><option value="25" selected>٢٥ دقيقة</option><option value="45">٤٥ دقيقة</option><option value="60">٦٠ دقيقة</option></select>
      <button id="start">ابدأ الجلسة</button>
      <button id="cancel" class="secondary" hidden>إلغاء المؤقت</button>
    </section>
    <section id="schedule" hidden>
      <h2>آخر جدول محفوظ</h2>
      <p id="schedule-date"></p>
      <ul id="tasks"></ul>
      <form id="new-task-form">
        <label for="new-task-title">مهمة جديدة لليوم</label>
        <input id="new-task-title" required maxlength="200" placeholder="اسم المهمة">
        <button id="new-task-submit">إضافة</button>
      </form>
      <p id="exam"></p>
    </section>
    <section id="task-conflicts" hidden><h2>مهام محتاجة اختيارك</h2><ul id="task-conflict-items"></ul></section>
    <section id="offline-study" hidden>
      <h2>الدروس والامتحانات</h2>
      <form id="lesson-form">
        <label for="lesson-choice">درس خلصته</label>
        <select id="lesson-choice" required></select>
        <button id="lesson-submit">سجّل الإكمال</button>
      </form>
      <form id="exam-form">
        <label for="exam-choice">امتحان حلّيته</label>
        <select id="exam-choice" required></select>
        <label for="exam-total">عدد الأسئلة</label>
        <input id="exam-total" type="number" min="1" max="500" required>
        <label for="exam-correct">عدد الصح</label>
        <input id="exam-correct" type="number" min="0" max="500" required>
        <label for="exam-difficulty">الصعوبة</label>
        <select id="exam-difficulty"><option value="easy">سهل</option><option value="medium" selected>متوسط</option><option value="hard">صعب</option></select>
        <label for="exam-missed">موضوعات الغلط، كل موضوع في سطر</label>
        <textarea id="exam-missed" maxlength="4800" rows="2"></textarea>
        <button id="exam-submit">سجّل النتيجة</button>
      </form>
      <ul id="offline-study-pending"></ul>
    </section>
  </main>
</body>
</html>
